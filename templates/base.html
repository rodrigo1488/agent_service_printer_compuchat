<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Print Agent{% endblock %}</title>
    <style>
        :root {
            --bg: #eef2f4;
            --surface: #ffffff;
            --ink: #14212b;
            --muted: #5b6b76;
            --line: #d7e0e6;
            --accent: #0f766e;
            --accent-hover: #0d5f59;
            --accent-soft: #d9f3ef;
            --danger: #b42318;
            --danger-soft: #fdecea;
            --ok: #027a48;
            --ok-soft: #e8f8ef;
            --warn: #b54708;
            --warn-soft: #fff4e5;
            --shadow: 0 10px 30px rgba(20, 33, 43, 0.08);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 500px at 10% -10%, #d8efe9 0%, transparent 55%),
                radial-gradient(900px 400px at 100% 0%, #e7eef5 0%, transparent 50%),
                var(--bg);
            min-height: 100vh;
            line-height: 1.45;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.25rem;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(145deg, #0f766e, #155e75);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: var(--shadow);
        }
        .brand h1 {
            font-size: 1.15rem;
            font-weight: 700;
        }
        .brand p {
            font-size: 0.82rem;
            color: var(--muted);
        }
        .nav-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0.3rem;
            backdrop-filter: blur(6px);
        }
        .nav-pills a {
            color: var(--muted);
            text-decoration: none;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .nav-pills a:hover { background: #f3f7f9; color: var(--ink); text-decoration: none; }
        .nav-pills a.active {
            background: var(--accent);
            color: #fff;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.25rem;
        }
        .page-title {
            font-size: 1.2rem;
            margin-bottom: 0.25rem;
        }
        .page-sub {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.1rem;
        }
        .alert {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.92rem;
        }
        .alert-success { background: var(--ok-soft); color: var(--ok); border: 1px solid #b7ebc8; }
        .alert-error { background: var(--danger-soft); color: var(--danger); border: 1px solid #f3c1bc; }
        .form-group { margin-bottom: 0.9rem; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.86rem;
        }
        input[type="text"], input[type="url"], input[type="password"], input[type="number"], select, textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fff;
            color: var(--ink);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #5faca5;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }
        .hint { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; }
        .hint code {
            background: #f1f5f7;
            padding: 0.05rem 0.35rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        .btn, button {
            appearance: none;
            border: none;
            border-radius: 10px;
            padding: 0.55rem 0.95rem;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
        }
        .btn:hover, button:hover { background: var(--accent-hover); }
        .btn-secondary { background: #0e7490; }
        .btn-secondary:hover { background: #155e75; }
        .btn-ghost {
            background: #f3f7f9;
            color: var(--ink);
            border: 1px solid var(--line);
        }
        .btn-ghost:hover { background: #e8eef2; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #912018; }
        .btn:disabled, button:disabled { opacity: 0.6; cursor: not-allowed; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        @media (max-width: 760px) {
            .topbar { flex-direction: column; align-items: flex-start; }
            .grid-2 { grid-template-columns: 1fr; }
            .nav-pills { width: 100%; }
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            border-radius: 999px;
            padding: 0.15rem 0.55rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge-ok { background: var(--ok-soft); color: var(--ok); }
        .badge-error { background: var(--danger-soft); color: var(--danger); }
        .badge-warn { background: var(--warn-soft); color: var(--warn); }
        .badge-muted { background: #eef2f5; color: var(--muted); }
        .tabs {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--line);
            margin-bottom: 1.1rem;
        }
        .tab-btn {
            background: transparent;
            color: var(--muted);
            border: none;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            padding: 0.7rem 0.85rem;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .tab-btn:hover { background: #f5f9fa; color: var(--ink); }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: transparent;
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .sticky-actions {
            position: sticky;
            bottom: 0.75rem;
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.25rem;
            padding: 0.75rem;
            background: rgba(255,255,255,0.92);
            border: 1px solid var(--line);
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">PA</div>
                <div>
                    <h1>Print Agent</h1>
                    <p>Impressão local · UniPlus · Compuchat</p>
                </div>
            </div>
            <nav class="nav-pills">
                <a href="/" class="{% if active_nav == 'config' %}active{% endif %}">Configuração</a>
                <a href="/products" class="{% if active_nav == 'products' %}active{% endif %}">Produtos UniPlus</a>
                <a href="/logs" class="{% if active_nav == 'logs' %}active{% endif %}">Logs</a>
                <a href="/status" class="{% if active_nav == 'status' %}active{% endif %}">Status</a>
            </nav>
        </header>
        <main class="panel">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
